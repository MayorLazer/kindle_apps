name: Build Kindle calendar

on:
  schedule:
    # Every 4h, so same-day calendar edits and the footer stamp stay current.
    # 10:00 UTC ~= 07:00 Argentina (UTC-3).
    - cron: "0 2,6,10,14,18,22 * * *"
  workflow_dispatch:
  push:
    paths:
      - "schedule/generate.py"
      - "schedule/boards.py"
      - "schedule/requirements.txt"
      - ".github/workflows/calendar.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: calendar-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r schedule/requirements.txt

      - name: Layout smoke tests
        run: python -m unittest discover -s schedule -p "test_*.py"

      - name: Generate calendar PNG/PDF
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          ICS_URLS: ${{ secrets.ICS_URLS }}
          ICS_URLS_PUBLIC: ${{ vars.ICS_URLS_PUBLIC }}
          EXTRAS_URL: ${{ secrets.EXTRAS_URL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          CALENDAR_DAYS: ${{ vars.CALENDAR_DAYS }}
          PNG_WIDTH: ${{ vars.PNG_WIDTH }}
          PNG_HEIGHT: ${{ vars.PNG_HEIGHT }}
          PNG_ROTATE: ${{ vars.PNG_ROTATE }}
          WEATHER_LAT: ${{ vars.WEATHER_LAT }}
          WEATHER_LON: ${{ vars.WEATHER_LON }}
          WEATHER_PLACE: ${{ vars.WEATHER_PLACE }}
        run: |
          if [ -z "$ICS_URL" ] && [ -z "$ICS_URLS" ]; then
            echo "Add repository secret ICS_URL (Google Calendar secret iCal address)."
            exit 1
          fi
          export TIMEZONE="${TIMEZONE:-America/Argentina/Buenos_Aires}"
          export CALENDAR_DAYS="${CALENDAR_DAYS:-14}"
          # Public, non-secret feeds, "|" separated. Argentina in Spanish and
          # USA in English, so the name's language tells the countries apart.
          AR_HOLIDAYS="https://calendar.google.com/calendar/ical/es.ar%23holiday%40group.v.calendar.google.com/public/basic.ics"
          US_HOLIDAYS="https://calendar.google.com/calendar/ical/en-gb.usa%23holiday%40group.v.calendar.google.com/public/basic.ics"
          export ICS_URLS_PUBLIC="${ICS_URLS_PUBLIC:-${AR_HOLIDAYS}|${US_HOLIDAYS}}"
          # Framebuffer size per fbink; PW3/PW4 would be 1072x1448.
          export PNG_WIDTH="${PNG_WIDTH:-758}"
          export PNG_HEIGHT="${PNG_HEIGHT:-1024}"
          # 90 = landscape (Kindle stood on its right edge)
          export PNG_ROTATE="${PNG_ROTATE:-90}"
          export WEATHER_LAT="${WEATHER_LAT:--31.4241}"
          export WEATHER_LON="${WEATHER_LON:--64.4978}"
          export WEATHER_PLACE="${WEATHER_PLACE:-Carlos Paz, Cordoba}"
          python schedule/generate.py --from-env --config schedule/config.ci.toml
          for f in calendar.png weekly.png today.png weather.png month.png; do
            if [ ! -s "schedule/output/$f" ]; then
              echo "Missing schedule/output/$f"
              exit 1
            fi
          done

      # The calendar holds personal events, tasks and contacts' birthdays, so
      # it goes to a private repo. This repo is public: nothing generated here
      # may be published as a Pages file or a workflow artifact.
      - name: Publish to private data repo
        env:
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
          DATA_REPO: ${{ vars.DATA_REPO }}
        run: |
          if [ -z "$DATA_DEPLOY_KEY" ] || [ -z "$DATA_REPO" ]; then
            echo "Missing DATA_DEPLOY_KEY secret or DATA_REPO variable."
            echo "See SETUP.md 'Private delivery'."
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$DATA_DEPLOY_KEY" > ~/.ssh/data_key
          chmod 600 ~/.ssh/data_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/data_key -o IdentitiesOnly=yes"

          rm -rf dist && mkdir dist
          cp schedule/output/calendar.png schedule/output/weekly.png \
             schedule/output/today.png schedule/output/weather.png \
             schedule/output/month.png schedule/output/calendar.pdf dist/
          date -u +"%Y-%m-%dT%H:%M:%SZ" > dist/updated.txt
          cd dist
          # A fresh orphan commit force-pushed every run keeps the data repo at
          # one commit, instead of growing a binary every 4 hours forever.
          git init -q
          git checkout -q -b dist
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -q -m "calendar $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "git@github.com:${DATA_REPO}.git" dist:dist
          echo "Pushed board PNGs + calendar.pdf to ${DATA_REPO} (branch dist)"

      # Overwrites the previously published site, so the old public
      # calendar.png / calendar.pdf stop resolving.
      - name: Stage placeholder Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>kindle calendar</title>
          <p>Nothing is published here. The generated calendar is delivered
          privately to the Kindle.</p>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
