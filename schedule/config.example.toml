# Copy to config.toml and edit. Never commit real ICS URLs.

# Public feeds can be added here too. The "es" / "en-gb" prefix picks the
# language of the holiday names, which is handy to tell countries apart:
#   "https://calendar.google.com/calendar/ical/es.ar%23holiday%40group.v.calendar.google.com/public/basic.ics"
#   "https://calendar.google.com/calendar/ical/en-gb.usa%23holiday%40group.v.calendar.google.com/public/basic.ics"
ics_urls = [
  "https://calendar.google.com/calendar/ical/REPLACE/private-REPLACE/basic.ics",
]

timezone = "America/Argentina/Buenos_Aires"
days = 14

# Weekly timetable PNG (KUAL view). 0..24 = full day.
schedule_days = 5
start_hour = 0
end_hour = 24

# Shrink empty hours outside the core band, so daytime rows stay readable
# on a 24h grid. An hour holding an event always keeps its full height.
compress_night = true
core_start_hour = 7
core_end_hour = 23

output = "output/calendar.pdf"
png_output = "output/calendar.png"
insecure_ssl = false

# Optional: Apps Script feed with Google Tasks + Contacts birthdays.
# See apps-script/Code.gs. Include the ?token=... part. Treat it as a secret.
extras_url = ""

# Open-Meteo (no API key). Used by Hoy + Clima. Defaults = Carlos Paz, Cordoba.
weather_lat = -31.4241
weather_lon = -64.4978
weather_place = "Carlos Paz, Cordoba"

ssh_host = ""
ssh_port = 2222
ssh_user = "root"

[screen]
width_in = 3.58
height_in = 4.82
# Must match the framebuffer fbink reports. PW1/PW2 = 758x1024,
# Touch/K4 = 600x800, PW3/PW4 = 1072x1448.
png_width = 758
png_height = 1024
# 90 = landscape, for standing the Kindle on its right edge. 0 = portrait.
png_rotate = 90
